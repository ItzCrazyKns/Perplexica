# Single Watchtower instance for the Unraid host. Set up ONCE — it covers every
# project whose container carries the label:
#     com.centurylinklabs.watchtower.enable=true
#
# Deploy:
#     docker compose -f docker-compose.watchtower.yaml up -d
#
# Watchtower does a full pull → stop → recreate → start (equivalent to
# `compose up -d`, NOT a bare `docker restart`), so updated images are actually
# picked up.

services:
  watchtower:
    # containrrr/watchtower is archived/abandoned and ships a Docker client too
    # old for current daemons ("client version 1.25 is too old"). Use the
    # actively maintained continuation instead.
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR packages here are private, so Watchtower needs the same
      # credentials used for `docker login ghcr.io` on this host:
      - /root/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_LABEL_ENABLE=true # only touch opted-in containers
      - WATCHTOWER_CLEANUP=true # delete old images after updating
      - WATCHTOWER_POLL_INTERVAL=300 # check every 5 minutes
      - TZ=UTC
    restart: unless-stopped
