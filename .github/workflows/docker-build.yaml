# Build & Push Docker Images — Penny13692018/Vane fork
#
# Pushes to `penny13692018/vane` (not the upstream `itzcrazykns1337/vane`).
# Triggers:
#   - push to master          -> latest / full-latest / main (full), slim-latest (slim)
#   - push to canary          -> canary (full), slim-canary (slim)
#   - push to feat/** feature -> <branch-with-dashes> (full), <branch>-slim (slim)
#   - release tag vX.Y.Z      -> vX.Y.Z / full-vX.Y.Z (full), slim-vX.Y.Z (slim)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKER_USERNAME  your Docker Hub username (e.g. penny13692018)
#   DOCKER_PASSWORD  a Docker Hub access token with Read & Write permission
#
# The arm64 image is built with QEMU emulation on ubuntu-latest so the workflow
# runs on any GitHub account. If your plan provides ARM-hosted runners, switch
# the build-arm64 job to `runs-on: ubuntu-24.04-arm` for much faster builds.

name: Build & Push Docker Images

on:
  push:
    branches:
      - master
      - canary
      - 'feat/**'
      - 'feature/**'
  release:
    types: [published]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      matrix:
        variant:
          - name: full
            dockerfile: Dockerfile
          - name: slim
            dockerfile: Dockerfile.slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute tag suffix
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "suffix=-${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_NAME" = "master" ]; then
            echo "suffix=" >> "$GITHUB_ENV"
          else
            echo "suffix=-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
          fi

      - name: Build and push AMD64 Docker image
        run: |
          VARIANT=${{ matrix.variant.name }}
          DOCKERFILE=${{ matrix.variant.dockerfile }}
          TAG="penny13692018/vane:${VARIANT}${suffix}-amd64"
          docker buildx build --platform linux/amd64 \
            --cache-from=type=registry,ref="${TAG}" \
            --cache-to=type=inline,mode=max \
            --provenance false \
            -f "$DOCKERFILE" \
            -t "$TAG" \
            --push .

  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      matrix:
        variant:
          - name: full
            dockerfile: Dockerfile
          - name: slim
            dockerfile: Dockerfile.slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute tag suffix
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "suffix=-${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_NAME" = "master" ]; then
            echo "suffix=" >> "$GITHUB_ENV"
          else
            echo "suffix=-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
          fi

      - name: Build and push ARM64 Docker image
        run: |
          VARIANT=${{ matrix.variant.name }}
          DOCKERFILE=${{ matrix.variant.dockerfile }}
          TAG="penny13692018/vane:${VARIANT}${suffix}-arm64"
          docker buildx build --platform linux/arm64 \
            --cache-from=type=registry,ref="${TAG}" \
            --cache-to=type=inline,mode=max \
            --provenance false \
            -f "$DOCKERFILE" \
            -t "$TAG" \
            --push .

  manifest:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        variant: [full, slim]
    steps:
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push multi-arch manifests
        run: |
          set -euo pipefail
          VARIANT=${{ matrix.variant }}

          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            SUFFIX="-${VERSION}"
            if [ "$VARIANT" = "full" ]; then
              MAIN_TAGS=("${VERSION}" "full-${VERSION}")
            else
              MAIN_TAGS=("slim-${VERSION}")
            fi
          elif [ "$GITHUB_REF_NAME" = "master" ]; then
            SUFFIX=""
            if [ "$VARIANT" = "full" ]; then
              MAIN_TAGS=("latest" "full-latest" "main")
            else
              MAIN_TAGS=("slim-latest")
            fi
          elif [ "$GITHUB_REF_NAME" = "canary" ]; then
            SUFFIX="-canary"
            if [ "$VARIANT" = "full" ]; then
              MAIN_TAGS=("canary")
            else
              MAIN_TAGS=("slim-canary")
            fi
          else
            BRANCH="${GITHUB_REF_NAME//\//-}"
            SUFFIX="-${BRANCH}"
            if [ "$VARIANT" = "full" ]; then
              MAIN_TAGS=("${BRANCH}")
            else
              MAIN_TAGS=("${BRANCH}-slim")
            fi
          fi

          AMD="penny13692018/vane:${VARIANT}${SUFFIX}-amd64"
          ARM="penny13692018/vane:${VARIANT}${SUFFIX}-arm64"

          for TAG in "${MAIN_TAGS[@]}"; do
            echo "Creating manifest penny13692018/vane:${TAG} from ${AMD} + ${ARM}"
            docker manifest create "penny13692018/vane:${TAG}" --amend "$AMD" --amend "$ARM"
            docker manifest push "penny13692018/vane:${TAG}"
          done
